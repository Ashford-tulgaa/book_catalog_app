apiVersion: batch/v1
kind: Job

metadata:
  name: book-catalog-migrate
  annotations:
    # Run migration before normal deployment.
    argocd.argoproj.io/hook: PostSync

    # Delete old migration Job before creating a new one.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

spec:
  template:
    spec:

      imagePullSecrets:
        - name: ghcr-secret

      restartPolicy: Never

      containers:
        - name: migrate

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          command:
            - python
            - manage.py
            - migrate

          envFrom:
            - configMapRef:
                name: book-catalog-api

            - secretRef:
                name: book-catalog-api
